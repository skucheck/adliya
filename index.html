<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FF5A00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Adliya SKU Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#FF5A00;--brand-hi:#FF7B33;--brand-soft:#FFE9DD;--on-brand:#fff;
  --bg:#EDEFF3;--surface:#FFFFFF;--surface-2:#F4F5F8;--line:#E1E4EA;
  --ink:#1B1820;--ink-2:#55515E;--ink-3:#8A8694;
  --ok:#0C9A55;--ok-soft:#DFF5E9;--warn:#B97500;--warn-soft:#FFF1D6;--bad:#D9363B;--bad-soft:#FCE4E4;
  --plate:#1B1820;--plate-ink:#FFFFFF;
  --sh-1:0 1px 2px rgba(27,24,32,.05),0 6px 20px -10px rgba(27,24,32,.16);
  --sh-2:0 14px 44px -12px rgba(27,24,32,.35);
  --r-lg:22px;--r-md:16px;
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'Space Grotesk','Manrope',system-ui,sans-serif;
  --nav-h:68px;
}
[data-theme=dark]{
  --brand-soft:#3A2114;
  --bg:#121015;--surface:#1C1920;--surface-2:#26222B;--line:#342E3A;
  --ink:#F2EEF5;--ink-2:#B7B0BF;--ink-3:#847D8D;
  --ok:#2BC97A;--ok-soft:#10301F;--warn:#F2B13C;--warn-soft:#352810;--bad:#FF6166;--bad-soft:#3A1719;
  --plate:#09080B;--plate-ink:#FFE4D3;
  --sh-1:0 1px 0 rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6);
  --sh-2:0 18px 50px -12px rgba(0,0,0,.75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(255,90,0,.55);outline-offset:2px}
h1,h2,h3{letter-spacing:-.01em}

/* ---------- touch feedback ---------- */
.tap{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.tap:active{transform:scale(.95)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.2;transform:scale(0);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.pop svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:none}30%{transform:scale(.7) rotate(-12deg)}65%{transform:scale(1.22) rotate(6deg)}100%{transform:none}}

/* ---------- app shell ---------- */
#app{max-width:540px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mark{width:42px;height:42px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(255,90,0,.75);flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t small{font-size:12.5px;color:var(--brand);font-weight:800}
.brand-t strong{font-size:19px;font-weight:800}
.top-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh-1);color:var(--ink);flex:none}
.icon-btn.sm{width:36px;height:36px;border-radius:12px;box-shadow:none;background:var(--surface-2)}
.theme-btn svg{transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.theme-btn.spin svg{transform:rotate(200deg) scale(.6)}
main{padding:2px 16px 0}
.view{display:none}
.view.on{display:block;animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.greet{margin:6px 2px 16px}
.greet p{margin:0;color:var(--ink-3);font-weight:600;font-size:14px}
.greet h1{margin:2px 0 0;font-size:27px;font-weight:800;line-height:1.15}
.h-top{margin:6px 2px 14px;display:flex;align-items:flex-end;gap:12px}
.h-top>div{flex:1;min-width:0}
.h-top h1{margin:0;font-size:26px;font-weight:800;line-height:1.15}
.h-top p{margin:3px 0 0;color:var(--ink-3);font-size:13.5px;font-weight:600}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.h-sec h2{font-size:17px;margin:0;font-weight:800}
.link{font-size:13px;color:var(--brand);font-weight:800;display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:10px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1);margin-bottom:12px}
.t-bad{color:var(--bad)}.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center;padding:18px;border-radius:26px;background:var(--surface);box-shadow:var(--sh-1);margin-bottom:14px}
.ring{position:relative;width:128px;height:128px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-c b{font-family:var(--f-num);font-size:32px;line-height:1;display:block}
.ring-c span{font-size:12px;color:var(--ink-3);font-weight:700}
.hero-stats{display:grid;gap:12px}
.stat b{font-family:var(--f-num);font-size:21px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2);font-weight:600}

/* ---------- celebrate ---------- */
.celebrate{position:relative;overflow:hidden;border-radius:26px;padding:26px 18px 22px;background:linear-gradient(140deg,#FF5A00 0%,#FF7B33 55%,#FFAA5C 100%);color:#fff;text-align:center;box-shadow:0 20px 44px -18px rgba(255,90,0,.8);margin-bottom:14px;width:100%;display:block}
.celebrate h2{font-size:28px;margin:8px 0 4px;font-weight:800}
.celebrate p{margin:0 auto;max-width:300px;font-weight:600;opacity:.95;font-size:14px}
.celebrate .replay{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:999px}
.claps{font-size:60px;display:inline-block;animation:clap .9s ease-in-out infinite;transform-origin:50% 85%;line-height:1}
@keyframes clap{0%,100%{transform:scale(1) rotate(0)}20%{transform:scale(.8,.9) rotate(-10deg)}45%{transform:scale(1.14) rotate(7deg)}70%{transform:scale(.9) rotate(-4deg)}}
.float-clap{position:absolute;bottom:-34px;font-size:22px;animation:floatUp 3.4s linear infinite;opacity:0;pointer-events:none}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(-260px) rotate(35deg);opacity:0}}

/* ---------- notes ---------- */
.note{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);margin-bottom:10px;background:var(--warn-soft);width:100%;text-align:left}
.note.bad{background:var(--bad-soft)}.note.brand{background:var(--brand-soft)}
.note .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--warn)}
.note.bad .ic{color:var(--bad)}.note.brand .ic{color:var(--brand)}
.note h3{margin:0 0 2px;font-size:14.5px;font-weight:800}
.note p{margin:0;font-size:13px;color:var(--ink-2);font-weight:500}
.note .go{margin-top:8px;display:inline-flex;font-weight:800;font-size:13px;color:var(--brand)}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.name-chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--ink)}
.name-chip em{font-style:normal;color:var(--bad);margin-left:5px;font-family:var(--f-num)}

/* ---------- data tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:5px;text-align:left;min-height:168px}
.tile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin-bottom:4px}
.tile h3{margin:0;font-size:14px;font-weight:800}
.tile .when{font-family:var(--f-num);font-size:14.5px;font-weight:600;line-height:1.25}
.tile .sub{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .up{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--brand);padding-top:6px}
.tile .bar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:auto}
.tile .bar i{display:block;height:100%;width:40%;background:var(--brand);border-radius:5px;animation:indet 1s ease-in-out infinite}
@keyframes indet{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
.tile .stale{color:var(--warn)}
.tile.empty-t{border:2px dashed var(--line);box-shadow:none;background:transparent}

/* ---------- people ---------- */
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:13.5px;color:#fff;flex:none;letter-spacing:.02em}
.prow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow .tx{flex:1;min-width:0}
.prow .tx b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .num{font-family:var(--f-num);font-weight:700;font-size:14px;color:var(--ink-2)}
.pbar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:inherit;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pbar.full i{background:var(--ok)}
.rchip{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent)}
[data-theme=dark] .rchip{color:color-mix(in srgb,var(--rc) 55%,#fff)}
.stack{display:flex;padding-left:8px;margin-top:10px;flex-wrap:wrap;gap:4px 0}
.stack .av{width:32px;height:32px;border-radius:11px;font-size:11px;margin-left:-8px;box-shadow:0 0 0 2.5px var(--surface)}

/* ---------- search / filters ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:15px;padding:0 14px;height:48px;box-shadow:var(--sh-1);margin-bottom:12px;color:var(--ink-3)}
.search input{border:0;background:transparent;outline:0;flex:1;height:100%;color:var(--ink);min-width:0}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none;display:inline-flex;align-items:center;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;border:1.5px solid var(--line);white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg.full{margin-bottom:12px;background:var(--surface);box-shadow:var(--sh-1)}
.seg button{flex:1;padding:9px 10px;border-radius:11px;font-weight:800;font-size:13px;color:var(--ink-3);text-align:center;transition:background .25s,color .25s}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 6px 14px -8px rgba(255,90,0,.9)}
.seg.quiet button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.seg .ct{font-family:var(--f-num);opacity:.8;margin-left:3px}

/* ---------- staff picker ---------- */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{background:var(--surface);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-1);text-align:left;display:flex;flex-direction:column;gap:10px}
.scard .top{display:flex;justify-content:space-between;align-items:center}
.scard .nm{font-weight:800;font-size:14px;line-height:1.25}
.scard .rl{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px}
.scard.done{box-shadow:0 0 0 2px var(--ok),var(--sh-1)}
.scard.me{box-shadow:0 0 0 2px var(--brand),var(--sh-1)}
.mring{position:relative;width:46px;height:46px}
.mring svg{transform:rotate(-90deg);display:block}
.mring .trk{stroke:var(--surface-2)}.mring .val{stroke:var(--brand);stroke-linecap:round}
.mring.full .val{stroke:var(--ok)}
.mring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:12px}
.badge-carry{font-size:11px;font-weight:800;color:var(--bad);background:var(--bad-soft);padding:2px 7px;border-radius:999px}

/* ---------- task detail ---------- */
.thead{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.thead .tx{flex:1;min-width:0}
.thead .tx b{font-size:20px;font-weight:800;display:block;line-height:1.2}
.tsum{background:var(--plate);color:var(--plate-ink);border-radius:24px;padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.tsum .row1{display:flex;justify-content:space-between;align-items:baseline}
.tsum .big{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
.tsum .big small{font-size:18px;opacity:.6}
.tsum .lbl{font-size:13px;opacity:.75;font-weight:600}
.tsum .pbar{background:rgba(255,255,255,.12);height:8px;margin-top:12px}
.tsum::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,0,.45),transparent 70%)}

/* ---------- SKU card ---------- */
.sku{background:var(--surface);border-radius:var(--r-lg);padding:15px;box-shadow:var(--sh-1);margin-bottom:12px;position:relative;overflow:hidden}
.sku-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.skuno{font-family:var(--f-num);font-weight:700;font-size:16px;padding:4px 10px;border-radius:10px;background:var(--surface-2)}
.skuno small{font-family:var(--f-ui);font-weight:700;color:var(--ink-3);font-size:11px;margin-right:5px}
.abc{font-family:var(--f-num);font-weight:700;font-size:12px;min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.abc.A{background:var(--brand);color:#fff}
.catc{font-size:12px;color:var(--ink-3);font-weight:700;margin-left:auto;text-align:right;max-width:46%;line-height:1.25}
.sku h3{font-size:16.5px;margin:11px 0 9px;line-height:1.3;font-weight:800}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.why span{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.why .bad{background:var(--bad-soft);color:var(--bad)}.why .warn{background:var(--warn-soft);color:var(--warn)}.why .brand{background:var(--brand-soft);color:var(--brand)}
.sec-l{font-size:12px;font-weight:800;color:var(--ink-3);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.locs{display:grid;gap:8px;margin-bottom:12px}
.loc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.plate{display:inline-flex;align-items:center;background:var(--plate);color:var(--plate-ink);border-radius:11px;padding:8px 13px 9px;font-family:var(--f-num);font-weight:700;font-size:21px;letter-spacing:.03em;box-shadow:inset 0 -4px 0 var(--brand);line-height:1}
.plate i{font-style:normal;color:var(--brand);margin:0 4px;font-weight:700}
.plate.muted{font-size:14px;box-shadow:inset 0 -4px 0 var(--ink-3)}
.locmeta{display:flex;flex-direction:column;font-size:12.5px;line-height:1.35;font-weight:600;color:var(--ink-2)}
.exp{font-weight:800}
.exp.ok{color:var(--ok)}.exp.warn{color:var(--warn)}.exp.bad{color:var(--bad)}
.eans{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ean{font-family:var(--f-num);font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:10px;border:1.5px dashed var(--line);display:inline-flex;gap:7px;align-items:center;color:var(--ink)}
.ean svg{color:var(--ink-3)}
.stockline{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);font-weight:700;margin-bottom:12px}
.stockline span{display:inline-flex;align-items:center;gap:5px}
.stockline b{font-family:var(--f-num);color:var(--ink)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:9px;padding:12px 11px;border-radius:15px;background:var(--surface-2);font-weight:800;font-size:13.5px;text-align:left;border:2px solid transparent;transition:background .25s,border-color .25s,color .25s;line-height:1.2}
.chk .bx{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:background .25s,border-color .25s;background:var(--surface)}
.chk .bx svg{opacity:0;transform:scale(.3) rotate(-30deg);transition:opacity .2s,transform .35s cubic-bezier(.3,1.7,.5,1)}
.chk.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chk.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.on .bx svg{opacity:1;transform:none}
.sku-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.issue-btn{display:inline-flex;gap:6px;align-items:center;font-weight:800;color:var(--ink-2);padding:6px 8px;margin-left:-8px;border-radius:10px}
.issue-btn.has{color:var(--bad)}
.done-by{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:800}
.sku.isdone{box-shadow:0 0 0 2px var(--ok),var(--sh-1)}
.sku.leaving{animation:leave .42s cubic-bezier(.6,0,.4,1) forwards}
@keyframes leave{to{opacity:0;transform:translateX(60px) scale(.95)}}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.burst span{width:78px;height:78px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:burst .5s cubic-bezier(.3,1.7,.5,1);box-shadow:0 0 0 0 rgba(12,154,85,.5);animation:burst .5s cubic-bezier(.3,1.7,.5,1),halo .9s ease-out}
@keyframes burst{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@keyframes halo{to{box-shadow:0 0 0 40px rgba(12,154,85,0)}}
.carry{font-size:11.5px;font-weight:800;color:var(--bad);background:var(--bad-soft);padding:3px 9px;border-radius:999px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:34px 20px;color:var(--ink-2)}
.empty .ic{width:66px;height:66px;border-radius:22px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:18px;font-weight:800}
.empty p{margin:0 auto 16px;max-width:300px;font-size:14px}
.allgood{text-align:center;padding:26px 18px;border-radius:24px;background:var(--ok-soft);margin-bottom:12px}
.allgood .claps{font-size:54px}
.allgood h3{margin:8px 0 4px;font-size:20px;color:var(--ok);font-weight:800}
.allgood p{margin:0;color:var(--ink-2);font-weight:600;font-size:14px}

/* ---------- history ---------- */
.hday{font-size:13px;font-weight:800;color:var(--ink-2);margin:18px 4px 8px;display:flex;justify-content:space-between}
.hday span{font-family:var(--f-num);color:var(--ink-3)}
.hrow{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--surface);border-radius:16px;margin-bottom:8px;box-shadow:var(--sh-1)}

    async range(p){const db=await open();

        rq.onsuccess=()=>{const c=rq.result;if(c){out.push({key:c.key,value:c.value});c.continue()}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
    async isPersistent(){return !!(await open())}

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const nl=text.indexOf('\n');const first=nl>0?text.slice(0,nl):text;
  const cnt=ch=>first.split(ch).length;
  const delim=cnt('\t')>cnt(',')?'\t':(cnt(';')>cnt(',')?';':',');
  const rows=[];let row=[],field='',q=false,start=0;const n=text.length;
  for(let i=0;i<n;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else q=false}else field+=c;continue}
    if(c==='"'){q=true;continue}
    if(c===delim){row.push(field);field='';continue}
    if(c==='\r')continue;
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';continue}
    field+=c;
  }
  if(field!==''||row.length){row.push(field);rows.push(row)}
  return rows;
}

  if(info.abc==='A'){sc+=25;why.push({t:'A-class item',k:'brand'})}else if(info.abc==='B')sc+=12;
  let md=null;for(const l of info.locs){const dd=daysUntil(l.x||l.e);if(dd!==null&&(md===null||dd<md))md=dd}
  if(md!==null){
    if(md<0){sc+=38;why.push({t:'Past expiry/pull date',k:'bad'})}
    else if(md<=3){sc+=30;why.push({t:md===0?'Pull today':`Pull in ${md}d`,k:'bad'})}

function ringSvg(p,size=128,stroke=12){
  const r=(size-stroke)/2,C=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/><circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-off="${(C*(1-p)).toFixed(2)}"/></svg>`;
}
function miniRing(d,t){
  const p=t?d/t:0,r=19,C=2*Math.PI*r;
  return `<span class="mring ${t&&d===t?'full':''}"><svg width="46" height="46" viewBox="0 0 46 46"><circle class="trk" cx="23" cy="23" r="${r}" fill="none" stroke-width="5"/><circle class="val" cx="23" cy="23" r="${r}" fill="none" stroke-width="5" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-p)).toFixed(2)}"/></svg><b>${d}/${t}</b></span>`;
}
function animateRings(scope){requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.ring .val',scope).forEach(v=>v.style.strokeDashoffset=v.dataset.off)))}

function resolvedDark(){const t=S.settings.theme;return t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){
  const dark=resolvedDark();document.documentElement.dataset.theme=dark?'dark':'light';
  const m=$('meta[name=theme-color]');if(m)m.content=$('#lock').hidden?(dark?'#121015':'#EDEFF3'):'#FF5A00';
  const b=$('#theme-btn');if(b)b.innerHTML=ic(dark?'sun':'moon',20);
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.theme==='system')applyTheme()})}catch(e){}

function buildNav(){

function go(v){

  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));

function updateNavBadge(){
  const b=$('#bnav [data-view=tasks]');if(!b)return;const st=todayStats();

function tileHtml(kind){
  const m=S.meta[kind],busy=S.busy[kind];
  const title=kind==='live'?'Live stock':'Locations & expiry';
  const stale=m&&(Date.now()-m.at>864e5);
  return `<button class="tile tap ${m?'':'empty-t'}" data-act="upload" data-kind="${kind}">
    <span class="ic">${ic(kind==='live'?'box':'map',21)}</span><h3>${title}</h3>
    ${m?`<span class="when ${stale?'stale':''}">${fmtDT(m.at)}</span><span class="sub">Updated ${rel(m.at)}<br>${m.skus.toLocaleString()} SKUs from ${m.rows.toLocaleString()} rows</span>`:`<span class="sub">${kind==='live'?'Product list export with stock on hand and barcodes':'Stock overview export with SKU locations and expiry dates'}</span>`}
    ${busy?`<span class="bar"><i></i></span><span class="sub">Reading file…</span>`:`<span class="up">${ic('upload',16)} ${m?'Upload new file':'Upload file'}</span>`}
  </button>`;
}
const tilesHtml=()=>`<div class="tiles">${tileHtml('live')}${tileHtml('loc')}</div>`;

    h+=iss.slice(0,5).map(({s,it})=>`<div class="hrow miss"><span class="st">${ic('flag',17)}</span><div class="mid"><div class="nm">${esc(it.name)}</div><div class="sub"><b>${esc(it.sku)}</b><span>${esc(it.locs.map(l=>l.l).join(', '))}</span></div>${it.issue.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="who"><b>${esc(s.name)}</b></div></div>`).join('');

function skuCard(sid,it){
  const cur=skuInfo(it.sku);

  const eans=uniq([...(it.eans||[]),...(cur?cur.eans:[])]);
  const soh=cur?cur.soh:it.soh;
  const why=(it.why||[]).map(w=>`<span class="${w.k}">${esc(w.t)}</span>`).join('');
  const locHtml=locs.length?locs.map(l=>{const dd=daysUntil(l.e);
    return `<div class="loc"><span class="plate">${plate(l.l||'—')}</span><span class="locmeta"><span class="exp ${expCls(dd)}">${l.e?'Exp '+fmtD(l.e):'No expiry date'}</span><span>${l.e?daysText(dd):''}${l.x&&l.x!==l.e?`${l.e?', ':''}pull by ${fmtD(l.x)}`:''}</span><span>Qty on shelf ${l.q}</span></span></div>`}).join('')
    :`<div class="loc"><span class="plate muted">No location in file</span></div>`;
  const key=`data-sid="${sid}" data-sku="${esc(it.sku)}"`;
  return `<article class="sku ${it.done?'isdone':''}" id="c-${esc(it.sku)}">
    <div class="sku-top"><span class="skuno"><small>SKU</small>${esc(it.sku)}</span>${it.abc?`<span class="abc ${esc(it.abc)}">${esc(it.abc)}</span>`:''}${it.carried?`<span class="carry">Pending from ${esc(it.from&&dayLabel(it.from)==='Yesterday'?'yesterday':fmtD(it.from))}</span>`:''}<span class="catc">${esc(it.cat)}</span></div>
    <h3>${esc(it.name)}</h3>
    ${why?`<div class="why">${why}</div>`:''}
    <div class="sec-l">${ic('pin',14)} Location${locs.length>1?'s':''}</div><div class="locs">${locHtml}</div>
    <div class="sec-l">${ic('barcode',14)} EAN${eans.length>1?` (${eans.length})`:''}</div>
    <div class="eans">${eans.length?eans.map(e=>`<button class="ean tap" data-act="copy" data-v="${esc(e)}">${esc(e)}${ic('copy',13)}</button>`).join(''):'<span class="sub" style="font-size:13px;color:var(--ink-3)">No barcode in files</span>'}</div>
    <div class="stockline"><span>${ic('box',15)} System stock <b>${soh}</b></span>${cur&&cur.locQty!==null&&cur.hasLive&&cur.locQty!==soh?`<span class="t-warn">Location file <b>${cur.locQty}</b></span>`:''}</div>
    <div class="checks">
      <button class="chk tap ${it.loc?'on':''}" data-act="tick" data-f="loc" ${key} aria-pressed="${it.loc}"><span class="bx">${ic('check',17,3)}</span>Location verified</button>
      <button class="chk tap ${it.exp?'on':''}" data-act="tick" data-f="exp" ${key} aria-pressed="${it.exp}"><span class="bx">${ic('check',17,3)}</span>Expiry verified</button>
    </div>
    <div class="sku-foot"><button class="issue-btn tap ${it.issue&&it.issue.length?'has':''}" data-act="issue" ${key}>${ic('flag',15)}${it.issue&&it.issue.length?esc(it.issue.join(', ')):'Report issue'}</button>${it.done?`<span class="done-by">${ic('check',15,3)} ${fmtT(it.at)}</span>`:''}</div>
  </article>`;
}
async function tick(sid,sku,f,btn){
  const s=S.today&&S.today.staff[sid];const it=s&&s.items.find(i=>i.sku===sku);if(!it)return;
  const was=it.done;it[f]=!it[f];it.done=it.loc&&it.exp;
  if(it.done&&!was){it.at=Date.now();it.by=s.name}
  if(!it.done){it.at=null;it.by=''}
  btn.classList.toggle('on',it[f]);btn.setAttribute('aria-pressed',it[f]);haptic(it[f]?12:6);
  saveDay(S.today);
  const card=btn.closest('.sku');
  if(it.done!==was){
    if(it.done){
      card.insertAdjacentHTML('beforeend',`<div class="burst"><span>${ic('check',40,3)}</span></div>`);haptic([12,40,18]);
      await sleep(560);card.classList.add('leaving');await sleep(400);
    }
    refreshTaskDetail();
    const d=s.items.filter(i=>i.done).length;
    if(it.done&&d===s.items.length){
      const st=todayStats();
      if(st.allDone)maybeCelebrate(true);else toast(`${s.name} finished all ${d} SKUs 👏`,'ok');
    }
  }
  updateNavBadge();
}
function refreshTaskDetail(){
  const s=S.today.staff[S.taskStaff];if(!s)return;
  const done=s.items.filter(i=>i.done),todo=s.items.filter(i=>!i.done);
  $('#tsum').innerHTML=tsumHtml(s);
  $$('#tseg .ct')[0].textContent=todo.length;$$('#tseg .ct')[1].textContent=done.length;
  $('#task-list').innerHTML=listHtml(S.taskStaff,s,S.taskTab==='done'?done:todo);
}

/* ================= HISTORY ================= */
function staffNameMap(){const m=new Map();for(const rec of Object.values(S.days))for(const [id,s] of Object.entries(rec.staff))m.set(id,s.name);S.staff.forEach(s=>m.set(s.id,s.name));return m}
function renderHistory(){
  const H=S.hist,el=$('#v-history');const names=[...staffNameMap().entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const R=[['today','Today'],['yesterday','Yesterday'],['7','7 days'],['30','30 days'],['all','All']];
  el.innerHTML=`<div class="h-top"><div><h1>History</h1><p>Every SKU check with the staff who did it.</p></div></div>
    <div class="seg full"><button class="tap ${H.mode==='done'?'on':''}" data-act="hist-mode" data-m="done">Checked</button><button class="tap ${H.mode==='miss'?'on':''}" data-act="hist-mode" data-m="miss">Not checked</button></div>
    <label class="search">${ic('search',18)}<input data-in="histq" placeholder="SKU, product, EAN or staff" value="${esc(H.q)}" autocomplete="off"></label>
    <div class="filters">${R.map(([k,l])=>`<button class="chip tap ${H.range===k?'on':''}" data-act="hist-range" data-r="${k}">${l}</button>`).join('')}<button class="chip tap ${H.issues?'on':''}" data-act="hist-iss">${ic('flag',13)} Issues only</button></div>
    <select class="inp" data-in="histstaff" style="margin-bottom:10px" aria-label="Filter by staff"><option value="">All staff</option>${names.map(([id,n])=>`<option value="${id}" ${H.staff===id?'selected':''}>${esc(n)}</option>`).join('')}</select>
    <div class="hist-sum"><span id="hist-count"></span><button class="link tap" data-act="hist-export">${ic('download',16)} Export CSV</button></div>
    <div id="hist-list"></div>`;
  renderHistList();
}
function histEntries(){
  const H=S.hist,today=dayKey();let min='',max='9999';
  if(H.range==='today')min=max=today;else if(H.range==='yesterday')min=max=shiftDate(today,-1);
  else if(H.range!=='all')min=shiftDate(today,-(+H.range-1));
  const q=H.q.trim().toLowerCase();const out=[];
  for(const [d,rec] of Object.entries(S.days)){
    if(d<min||d>max)continue;if(H.mode==='miss'&&d>=today)continue;
    for(const [id,s] of Object.entries(rec.staff)){
      if(H.staff&&id!==H.staff)continue;
      for(const it of s.items){
        if(H.mode==='done'?!it.done:(it.done||s.off))continue;
        if(H.issues&&!(it.issue&&it.issue.length))continue;
        if(q&&!(it.sku.toLowerCase().includes(q)||it.name.toLowerCase().includes(q)||s.name.toLowerCase().includes(q)||(it.eans||[]).some(e=>e.includes(q))||(it.locs||[]).some(l=>(l.l||'').toLowerCase().includes(q))))continue;
        out.push({d,id,s,it});
      }
    }
  }
  out.sort((a,b)=>b.d.localeCompare(a.d)||(b.it.at||0)-(a.it.at||0));
  return out;
}
function renderHistList(){
  const list=histEntries(),H=S.hist;
  $('#hist-count').textContent=`${list.length.toLocaleString()} ${H.mode==='done'?'checked':'not checked'}`;
  if(!list.length){$('#hist-list').innerHTML=`<div class="card" style="margin-top:12px"><div class="empty"><span class="ic">${ic('history',30)}</span><h3>${H.mode==='done'?'No checks found':'Nothing missed'}</h3><p>${H.mode==='done'?'Checked SKUs show here with the staff name and time. Try a wider date range.':'Every assigned SKU in this range was checked.'}</p></div></div>`;return}
  let h='',last='';
  for(const e of list.slice(0,H.limit)){
    if(e.d!==last){const c=list.filter(x=>x.d===e.d).length;h+=`<div class="hday">${esc(dayLabel(e.d))}<span>${c}</span></div>`;last=e.d}
    const miss=H.mode==='miss',it=e.it;

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#party canvas'),ctx=cv.getContext('2d'),dpr=devicePixelRatio||1;
  const W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr;
  const cols=['#FF5A00','#FF8A3D','#FFC24B','#2BC97A','#FFFFFF','#7C3AED','#FF6B9A'];
  const P=[];for(let i=0;i<200;i++){const left=i%2===0;P.push({x:left?-10:W+10,y:H*(.55+Math.random()*.25),vx:(left?1:-1)*(Math.random()*14+6)*dpr,vy:-(Math.random()*20+10)*dpr,r:(Math.random()*7+5)*dpr,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.35,s:Math.random()<.65})}
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);
    for(const p of P){p.vy+=.42*dpr;p.vx*=.985;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
      if(p.s)ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{ctx.beginPath();ctx.arc(0,0,p.r/2.6,0,7);ctx.fill()}ctx.restore()}
    if(t-t0<4200&&$('#party').classList.contains('on'))requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})(t0);
}

let uploadKind=null;
function pickFile(kind){
  uploadKind=kind;const fi=$('#file-in');fi.value='';
  fi.accept=kind==='backup'?'.json,application/json':'.csv,.xlsx,.xls,text/csv';fi.click();

function setBusy(kind,v){S.busy[kind]=v;if(S.view==='home'||S.view==='settings')render()}
async function handleFile(file,kind){
  if(kind==='backup')return restoreBackup(file);
  setBusy(kind,true);
  try{
    await nextFrame();
    const rows=/\.(xlsx|xls)$/i.test(file.name)?await readXlsx(file):parseCSV(await file.text());
    if(!rows.length)throw new Error('This file is empty.');
    let hi=-1,m=null,type=null;
    for(let i=0;i<Math.min(6,rows.length);i++){const mm=headerIndex(rows[i]),t=detectType(mm);if(t){hi=i;m=mm;type=t;break}}
    if(!type)throw new Error(kind==='live'?'Columns sku_id and stock_on_hand were not found. Upload the product list export.':'Columns Sku and Location were not found. Upload the stock overview export.');
    const body=rows.slice(hi);const data=type==='loc'?buildLoc(body,m):buildLive(body,m);
    const n=Object.keys(data).length;if(!n)throw new Error('No SKUs were found in this file.');
    const meta={name:file.name,at:Date.now(),mod:file.lastModified||null,rows:body.length-1,skus:n};
    S[type]=data;S.meta[type]=meta;
    await DB.set('data:'+type,data);await DB.set('meta:'+type,meta);
    if(kind&&type!==kind)toast(`That was the ${type==='loc'?'location':'live stock'} file, so it was saved there.`);
    else toast(`${type==='loc'?'Locations':'Live stock'} updated: ${n.toLocaleString()} SKUs`,'ok');
    if(type==='loc'&&S.today){
      const items=Object.values(S.today.staff).flatMap(x=>x.items);
      if(items.length&&items.every(i=>!i.locs.length)&&!items.some(i=>i.loc||i.exp||i.done)){delete S.days[S.today.date];await DB.del('day:'+S.today.date);S.today=null}
    }
    const hadToday=!!S.today;
    if(!hadToday){await ensureToday();if(S.today)setTimeout(()=>toast(`Today’s lists are ready: ${todayStats().total} SKUs for ${todayStats().staffTotal} staff`,'ok'),900)}
  }catch(err){console.error(err);toast(err.message||'This file could not be read.','bad')}
  finally{S.busy[kind]=false;render()}
}

async function restoreBackup(file){
  try{

    const ok=await confirmSheet('Restore this backup?',`It has ${j.staff.length} staff and ${Object.keys(j.days).length} days of history. Days in the backup replace the same days on this phone.`,'Restore');

  switch(a){
    case 'nav':if(d.view==='tasks'&&S.view==='tasks'&&S.taskStaff){S.taskStaff=null}go(d.view);break;
    case 'key':keyIn(d.k);break;
    case 'lock':ss.del('tm-unlock');showLock();break;
    case 'theme-toggle':{t.classList.add('spin');S.settings.theme=resolvedDark()?'light':'dark';saveSettings();setTimeout(()=>{applyTheme();t.classList.remove('spin');if(S.view==='settings')renderSettings()},180);break}
    case 'theme-set':S.settings.theme=d.t;saveSettings();applyTheme();renderSettings();break;
    case 'upload':if(!S.busy[d.kind])pickFile(d.kind);break;
    case 'open-staff':closeSheet();if(!S.today||!S.today.staff[d.id]||S.today.staff[d.id].off){toast('No list for this person today.','bad');break}S.taskStaff=d.id;S.taskTab='todo';ls.set('tm-me',d.id);go('tasks');break;
    case 'task-back':S.taskStaff=null;renderTasks();window.scrollTo({top:0});break;
    case 'task-tab':S.taskTab=d.t;$$('#tseg button').forEach(b=>b.classList.toggle('on',b.dataset.t===d.t));refreshTaskDetail();break;
    case 'tick':tick(d.sid,d.sku,d.f,t);break;
    case 'copy':copyText(d.v);break;
    case 'issue':issueSheet(d.sid,d.sku);break;
    case 'issue-chip':t.classList.toggle('on');break;
    case 'issue-save':saveIssue(d.sid,d.sku,false);break;
    case 'issue-clear':saveIssue(d.sid,d.sku,true);break;
    case 'sheet-close':closeSheet(false);break;
    case 'sheet-ok':closeSheet(true);break;
    case 'party':party();break;
    case 'party-close':$('#party').classList.remove('on');break;
    case 'hist-mode':S.hist.mode=d.m;S.hist.limit=60;renderHistory();break;
    case 'hist-range':S.hist.range=d.r;S.hist.limit=60;renderHistory();break;
    case 'hist-iss':S.hist.issues=!S.hist.issues;S.hist.limit=60;renderHistory();break;
    case 'hist-issues':Object.assign(S.hist,{mode:'done',range:'today',issues:true,staff:'',q:'',limit:60});S.hist.mode='done';go('history');break;
    case 'hist-more':S.hist.limit+=60;renderHistList();break;
    case 'hist-export':exportHistory();break;
    case 'team-role':S.teamRole=d.r;$$('#v-team .filters .chip').forEach(c=>c.classList.toggle('on',c.dataset.r===d.r));filterTeam();break;
    case 'staff-add':staffForm(null);break;
    case 'staff-edit':staffForm(S.staff.find(s=>s.id===d.id));break;
    case 'pick-role':$$('#sf-role .chip').forEach(c=>c.classList.toggle('on',c===t));break;
    case 'staff-save':saveStaffForm(d.id);break;
    case 'staff-menu':staffMenu(d.id);break;
    case 'staff-active':await toggleActive(d.id);break;
    case 'staff-off':{closeSheet();releaseStaffToday(d.id);await saveDay(S.today);toast('Marked as day off. Their SKUs were released.');render();break}
    case 'staff-on':{closeSheet();const st=S.staff.find(s=>s.id===d.id);await addStaffToday(st);toast(`${st.name} is back with ${S.today.staff[st.id].items.length} SKUs`,'ok');render();break}
    case 'staff-del':{const st=S.staff.find(s=>s.id===d.id);const ok=await confirmSheet(`Remove ${st.name}?`,'They leave the team and today’s unchecked SKUs are released. Their past checks stay in History.','Remove',true);
      if(ok){S.staff=S.staff.filter(s=>s.id!==d.id);await saveStaff();if(S.today){releaseStaffToday(d.id);await saveDay(S.today)}toast(`${st.name} removed`);render()}break}
    case 'pwd-change':pwdSheet();break;
    case 'pwd-save':savePwd();break;
    case 'set-toggle':S.settings[d.k]=!S.settings[d.k];saveSettings();t.classList.toggle('on',S.settings[d.k]);break;
    case 'per':{const v=Math.max(3,Math.min(30,S.settings.perStaff+(+d.d)));S.settings.perStaff=v;saveSettings();renderSettings();break}
    case 'norepeat':S.settings.noRepeat=+d.n;saveSettings();renderSettings();break;
    case 'cat-prio':catSheet();break;
    case 'cat-set':S.settings.catPriority[d.c]=d.l;saveSettings();$$(`#sheet [data-act=cat-set]`).filter(b=>b.dataset.c===d.c).forEach(b=>b.classList.toggle('on',b.dataset.l===d.l));break;
    case 'cat-reset':S.settings.catPriority={};saveSettings();catSheet();break;
    case 'regen':await regen();break;
    case 'backup-out':backupOut();break;
    case 'reset':{const ok=await confirmSheet('Reset the app?','This deletes both data files, team changes, settings and all check history on this phone. Save a backup first if you need it.','Reset everything',true);
      if(ok){try{indexedDB.deleteDatabase('tm-adliya-sku-check')}catch(e){}try{localStorage.removeItem('tm-me')}catch(e){}ss.del('tm-unlock');setTimeout(()=>location.reload(),300)}break}
  }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;
  if(k==='taskq'){const q=e.target.value.toLowerCase().trim();$$('#v-tasks .scard').forEach(c=>c.hidden=!!q&&!c.dataset.name.includes(q))}
  else if(k==='teamq')filterTeam();
  else if(k==='histq'){S.hist.q=e.target.value;S.hist.limit=60;histDeb()}
});
document.addEventListener('change',async e=>{
  const k=e.target.dataset.in;
  if(k==='histstaff'){S.hist.staff=e.target.value;S.hist.limit=60;renderHistList()}
  else if(k==='daystart'){S.settings.dayStart=+e.target.value;await saveSettings();toast('Saved. Takes effect from the next day change.')}
});
$('#file-in').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleFile(f,uploadKind)});
document.addEventListener('keydown',e=>{
  if(!$('#lock').hidden){if(/^\d$/.test(e.key))keyIn(e.key);else if(e.key==='Backspace')keyIn('del');return}
  if(e.key==='Escape'){closeSheet();$('#party').classList.remove('on')}
});
async function toggleActive(id){
  const st=S.staff.find(s=>s.id===id);if(!st)return;st.active=!st.active;await saveStaff();
  if(S.today){
    if(!st.active){releaseStaffToday(id);await saveDay(S.today)}
    else{const e=S.today.staff[id];if(!e||e.off||!e.items.length)await addStaffToday(st)}
  }
  toast(st.active?`${st.name} is on daily checks`:`${st.name} is off daily checks`);renderTeam();updateNavBadge();
}
async function regen(){
  if(!S.today){toast('Upload the files first.','bad');return}
  const ids=Object.entries(S.today.staff).filter(([,s])=>!s.off&&!s.items.some(i=>i.done||i.loc||i.exp)).map(([id])=>id);
  if(!ids.length){toast('Everyone has started, so no lists were changed.');return}
  const ok=await confirmSheet('Rebuild today’s lists?',`${ids.length} staff haven’t ticked anything yet. They get a fresh list of ${S.settings.perStaff} SKUs using the latest files and settings.`,'Rebuild');
  if(!ok)return;
  ids.forEach(id=>{S.today.staff[id].items=S.today.staff[id].items.filter(i=>i.carried)});
  distribute(S.today,ids,buildPool(todaySkus()),S.settings.perStaff);
  await saveDay(S.today);toast(`Rebuilt lists for ${ids.length} staff`,'ok');render();
}
function issueSheet(sid,sku){
  const it=S.today.staff[sid].items.find(i=>i.sku===sku);
  openSheet(`<h2>Report an issue</h2><p class="lead">${esc(it.name)}<br><span style="font-family:var(--f-num);font-weight:700">SKU ${esc(it.sku)}</span></p>
    <div class="field"><label>What did you find?</label><div class="chips">${ISSUES.map(x=>`<button class="chip tap ${(it.issue||[]).includes(x)?'on':''}" data-act="issue-chip" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>
    <div class="field"><label for="is-note">Note (optional)</label><textarea class="inp" id="is-note" placeholder="e.g. Found 3 units in A04-02-003">${esc(it.note||'')}</textarea></div>
    <div class="btn-row"><button class="btn ghost tap" data-act="issue-clear" data-sid="${sid}" data-sku="${esc(sku)}">Clear issue</button><button class="btn tap" data-act="issue-save" data-sid="${sid}" data-sku="${esc(sku)}">Save issue</button></div>`);
}
async function saveIssue(sid,sku,clear){
  const it=S.today.staff[sid].items.find(i=>i.sku===sku);
  it.issue=clear?[]:$$('#sheet .chip.on').map(c=>c.dataset.v);it.note=clear?'':$('#is-note').value.trim();
  if(!clear&&!it.issue.length&&it.note)it.issue=['Other'];
  await saveDay(S.today);closeSheet();toast(clear?'Issue cleared':(it.issue.length?'Issue saved':'No issue selected'),clear||it.issue.length?'ok':'');
  if(S.view==='tasks'&&S.taskStaff)refreshTaskDetail();else render();
}
async function copyText(v){
  try{await navigator.clipboard.writeText(v)}catch(e){const ta=document.createElement('textarea');ta.value=v;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}
  toast(`EAN ${v} copied`,'ok');
}

/* ================= day change watcher ================= */
setInterval(()=>{
  if($('#app').hidden)return;
  const k=dayKey();
  if((S.today&&S.today.date!==k)||(ss.get('tm-unlock')&&ss.get('tm-unlock')!==k)){ss.del('tm-unlock');S.today=null;S.taskStaff=null;showLock();$('#lk-msg').textContent='New day started. Enter today’s passcode'}
},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#app').hidden&&S.view==='home')renderHome()});

/* ================= boot ================= */
(async function boot(){
  $('#mark').innerHTML=ic('basket',22,2.2);$('#lock-btn').innerHTML=ic('lock',20);
  buildNav();buildPad();
  const [st,staff,loc,live,mLoc,mLive,days]=await Promise.all([DB.get('settings'),DB.get('staff'),DB.get('data:loc'),DB.get('data:live'),DB.get('meta:loc'),DB.get('meta:live'),DB.range('day:')]);
  S.settings={...DEF,...(st||{})};
  if(staff&&staff.length)S.staff=staff;else{S.staff=SEED.map(([name,role])=>({id:uid(),name,role,active:true}));await saveStaff()}
  S.loc=loc||null;S.live=live||null;S.meta={loc:mLoc||null,live:mLive||null};
  days.forEach(x=>{S.days[x.value.date]=x.value});
  applyTheme();
  if(!(await DB.isPersistent()))setTimeout(()=>toast('This browser blocks storage, so data is lost when the page closes.','bad'),1500);
  if(ss.get('tm-unlock')===dayKey()){$('#lock').hidden=true;await enterApp();applyTheme()}else showLock();
})();
</script>
</body>
</html>
